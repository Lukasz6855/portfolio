site_name: Portfolio Projektów AI & Data Science
site_description: Portfolio projektów z zakresu Data Science, Machine Learning i Aplikacji AI
site_author: Łukasz Sachmerda
site_url: https://twoja-nazwa.github.io/portfolio/

# Repository
repo_name: Lukasz6855/portfolio
repo_url: https://github.com/Lukasz6855/portfolio

# Copyright
copyright: Copyright &copy; 2026 Łukasz

# Configuration
theme:
  name: material
  language: pl
  palette:
    # Palette toggle for light mode
    - scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: Przełącz na tryb ciemny
    # Palette toggle for dark mode
    - scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: Przełącz na tryb jasny
  font:
    text: Roboto
    code: Roboto Mono
  features:
    - navigation.instant
    - navigation.tracking
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.sections
    - navigation.expand
    - navigation.top
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.code.annotate
  icon:
    repo: fontawesome/brands/github

# Plugins
plugins:
  - search:
      lang: pl
  - tags

# Extensions
markdown_extensions:
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.details
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - admonition
  - attr_list
  - md_in_html
  - tables
  - footnotes
  - def_list
  - pymdownx.tasklist:
      custom_checkbox: true
  - pymdownx.arithmatex:
      generic: true

# Extra JavaScript
extra_javascript:
  - javascripts/mathjax.js
  - https://polyfill.io/v3/polyfill.min.js?features=es6
  - https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js

# Extra CSS
extra_css:
  - stylesheets/extra.css

# Page tree
nav:
  - Strona Główna: index.md
  - O Mnie: o-mnie.md
  - Aplikacje AI:
    - aplikacje-ai/index.md
    - Podsumowanie Audio/Video: aplikacje-ai/podsumowanie-audio-video.md
    - Pomocnik Prezentowy AI: aplikacje-ai/pomocnik-prezentowy.md
    - Znajdywacz Zdjęć: aplikacje-ai/znajdywacz-zdjec.md
  - Machine Learning:
    - machine-learning/index.md
    - Titanic Classification: machine-learning/titanic-classification.md
    - House Price Regression: machine-learning/house-price-regression.md
    - Customer Segmentation: machine-learning/customer-segmentation.md
    - Churn Prediction:
      - Overfitting Analysis: machine-learning/churn-overfitting.md
      - Model Tuning: machine-learning/churn-model-tuning.md
      - Recall & Threshold: machine-learning/churn-recall-threshold.md
      - Model Deployment: machine-learning/churn-model-deployment.md
      - Model Explainability: machine-learning/churn-explainability.md
    - Half Marathon Prediction: machine-learning/halfmarathon-prediction.md
    - Prognoza Cen Ubezpieczeń: machine-learning/prognoza-ubezpieczen.md
  - Data Science:
    - data-science/index.md
    - Analiza EDA - Irisy: data-science/irisy-eda.md
    - Analiza EDA - Titanic: data-science/titanic-eda.md
  - Kontakt: kontakt.md

# Extra
extra:
